services:

  # =========================================================
  # POSTGRESQL + PGVECTOR
  # =========================================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: wings-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - wings-network

    # Local development
    mem_limit: 1g
    cpus: "0.5"

    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=30

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # =========================================================
  # PGADMIN
  # =========================================================

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wings-pgadmin
    restart: unless-stopped

    profiles:
      - admin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "5050:80"

    networks:
      - wings-network

    depends_on:
      postgres:
        condition: service_healthy

    mem_limit: 512m
    cpus: "0.2"


  # =========================================================
  # OLLAMA
  #
  # LOCAL DEVELOPMENT LLM
  #
  # MODEL:
  # qwen2.5:1.5b
  #
  # Backend:
  # http://ollama:11434
  # =========================================================

  ollama:
    image: ollama/ollama:latest
    container_name: wings-ollama
    restart: unless-stopped

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - wings-network

    environment:
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"

    # =======================================================
    # LOCAL MAC DEVELOPMENT
    #
    # Your Mac has 8 CPUs.
    # Give Ollama 4 CPUs so local inference is responsive.
    # =======================================================

    mem_limit: 5g
    cpus: "4.0"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ollama list >/dev/null 2>&1"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s


  # =========================================================
  # FASTAPI BACKEND
  # =========================================================

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: wings-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:

      # =====================================================
      # AI / OLLAMA
      # =====================================================

      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:1.5b

      # Local development safety timeout.
      OLLAMA_TIMEOUT_SECONDS: "120"

      # Keep prompts small for the 1.5B model.
      AI_MAX_PROMPT_LENGTH: "4000"

      # Small responses = faster inference.
      AI_MAX_OUTPUT_TOKENS: "128"

      # Deterministic enterprise responses.
      AI_TEMPERATURE: "0.1"

    ports:
      - "8000:8000"

    networks:
      - wings-network

    depends_on:
      postgres:
        condition: service_healthy

      ollama:
        condition: service_healthy

    mem_limit: 768m
    cpus: "0.5"


  # =========================================================
  # REACT FRONTEND
  # =========================================================

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: wings-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    networks:
      - wings-network

    depends_on:
      backend:
        condition: service_started

    mem_limit: 256m
    cpus: "0.2"


# ===========================================================
# PERSISTENT VOLUMES
# ===========================================================

volumes:

  postgres_data:
    name: wings_postgres_data

  ollama_data:
    name: wings_ollama_data


# ===========================================================
# NETWORK
# ===========================================================

networks:

  wings-network:
    name: wings-network
    driver: bridge