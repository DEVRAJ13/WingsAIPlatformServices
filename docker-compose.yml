services:

  postgres:
    image: postgres:16
    container_name: wings-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: wings_user
      POSTGRES_PASSWORD: wings_password
      POSTGRES_DB: wings_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wings_user -d wings_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wings-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: