#cloud-config

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - git
  - jq
  - unzip
  - openssl


runcmd:

  # ============================================================
  # DOCKER REPOSITORY
  # ============================================================

  - install -m 0755 -d /etc/apt/keyrings

  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc

  - chmod a+r /etc/apt/keyrings/docker.asc

  - |
    echo \
      "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
      https://download.docker.com/linux/ubuntu \
      $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
      > /etc/apt/sources.list.d/docker.list


  # ============================================================
  # DOCKER
  # ============================================================

  - apt-get update

  - apt-get install -y \
      docker-ce \
      docker-ce-cli \
      containerd.io \
      docker-buildx-plugin \
      docker-compose-plugin


  # ============================================================
  # DOCKER SERVICE
  # ============================================================

  - systemctl enable docker

  - systemctl start docker


  # ============================================================
  # UBUNTU USER
  # ============================================================

  - usermod -aG docker ubuntu


  # ============================================================
  # APPLICATION DIRECTORIES
  # ============================================================

  - mkdir -p /opt/wings-ai-platform

  - mkdir -p /opt/wings-ai-platform/deployment

  - mkdir -p /opt/wings-ai-platform/backups

  - mkdir -p /opt/wings-ai-platform/postgres

  - mkdir -p /opt/wings-ai-platform/ollama

  - mkdir -p /opt/wings-ai-platform/pgadmin

  - chown -R ubuntu:ubuntu /opt/wings-ai-platform


  # ============================================================
  # DOCKER NETWORK
  # ============================================================

  - docker network create wings-network || true


  # ============================================================
  # VERIFICATION
  # ============================================================

  - docker --version

  - docker compose version